name: Neuro-Symbolic Socratic Tutor CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'ai-tutor-511715' }}
  GCP_REGION: "us-central1"
  GAR_REPOSITORY: "socratic-tutor"
  CLOUD_RUN_SERVICE: "socratic-virtual-tutor-api"

jobs:
  verify-and-test:
    name: Phase 0-5 Verification Gates (Pytest + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Locked CPU-Only Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Pytest Suite & Handoff Governance Checks
        run: pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Verify TypeScript Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-and-deploy-cloud-run:
    name: Build Docker Image & Deploy to Google Cloud Run
    needs: verify-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK & Configure Docker for Artifact Registry
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Capture previous serving revision (for rollback)
        id: prev
        run: |
          PREV=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "revision=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous revision: ${PREV:-none}"

      - name: Build & Push Lightweight CPU-Only Container
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/backend:${{ github.sha }}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy to Google Cloud Run (Secret Manager + scale-to-zero)
        id: deploy
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/backend:${{ github.sha }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image="${IMAGE_URI}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --set-secrets="JWT_SECRET_KEY=JWT_SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest" \
            --set-env-vars="APP_ENV=production,DEBUG=false,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          # Same-origin SPA: allow the Cloud Run URL itself for any residual CORS needs
          gcloud run services update ${{ env.CLOUD_RUN_SERVICE }} \
            --region="${{ env.GCP_REGION }}" \
            --update-env-vars="CORS_ORIGINS=${SERVICE_URL}"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: ${SERVICE_URL}"

      - name: Post-deploy smoke test (ownership + turn)
        id: smoke
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python scripts/smoke_post_deploy.py --base-url "${{ steps.deploy.outputs.service_url }}"

      - name: Roll back traffic to previous revision on smoke failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.revision != ''
        run: |
          echo "Smoke failed — routing 100% traffic back to ${{ steps.prev.outputs.revision }}"
          gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
            --region="${{ env.GCP_REGION }}" \
            --to-revisions="${{ steps.prev.outputs.revision }}=100"
